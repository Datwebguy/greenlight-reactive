name: Agent

# Asks the hosted agent to make its next decisions. Each account is decided at most once per interval,
# so an extra or late run is harmless.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run one round of decisions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://greenlight-algo-dao-30577dec.vercel.app' }}
        run: |
          curl -sS --fail-with-body --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL}/api/agent/tick"
